<div class="card mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start">
      <h5 class="card-title mb-1">{{ trip.name }}</h5>
      <span class="badge text-bg-primary">${{ trip.price }}</span>
    </div>
    <p class="card-text mb-1">{{ trip.length }}</p>
    <small class="text-muted">{{ trip.code }}</small>
  </div>
</div>
